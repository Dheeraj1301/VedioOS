name: Hourly reminders and cleanup

# Vercel Hobby runs crons once a day; this calls the same protected endpoint every hour
# so editor deadline reminders (12h, 6h) and unpaid-project reminders go out on time.
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Call the scheduled sweep
        if: env.CRON_SECRET != ''
        run: |
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://brio.org.in/internal/expire-unpaid-projects/
