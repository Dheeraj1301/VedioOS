name: Application checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: application-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: JavaScript and vendored assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Check JavaScript syntax
        run: npm run check:javascript

      - name: Rebuild committed vendor assets
        run: npm run check:vendor

  backend:
    name: Django, migrations, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEBUG: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      SECRET_KEY: "ci-only-synthetic-key-0123456789abcdef-0123456789abcdef-0123456789"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt

      - name: Check Django configuration
        run: python manage.py check --settings=vedioos.test_settings

      - name: Reject missing migrations
        run: python manage.py makemigrations --check --dry-run --settings=vedioos.test_settings

      - name: Lint Python
        run: python -m ruff check .

      - name: Run isolated backend suite
        run: python manage.py test
