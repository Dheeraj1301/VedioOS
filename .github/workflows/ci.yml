name: Application checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: application-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Django, migrations, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock.txt

      - name: Check Django configuration
        run: python manage.py check --settings=vedioos.test_settings

      - name: Reject missing migrations
        run: python manage.py makemigrations --check --dry-run --settings=vedioos.test_settings

      - name: Lint Python
        run: python -m ruff check .

      - name: Run isolated backend suite
        run: python manage.py test
