<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset your VedioOS password</title>
</head>
<body style="margin:0;background:#f4f6f1;color:#16251e;font-family:Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f6f1;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #dce3d8;border-radius:16px;">
          <tr>
            <td style="padding:36px;">
              <p style="margin:0 0 24px;color:#174c3c;font-size:22px;font-weight:700;">VedioOS</p>
              <h1 style="margin:0 0 16px;font-size:28px;line-height:1.2;">Reset your password</h1>
              <p style="margin:0 0 24px;color:#526159;font-size:16px;line-height:1.6;">Enter this six-digit code on the VedioOS password-reset screen:</p>
              <p style="margin:0 0 24px;padding:18px;background:#edf3e5;border-radius:10px;color:#174c3c;font-size:32px;font-weight:700;letter-spacing:8px;text-align:center;">{{ .Token }}</p>
              <p style="margin:0 0 12px;color:#526159;font-size:14px;line-height:1.6;">This code is short-lived. If you did not request a password reset, you can safely ignore this email.</p>
              <p style="margin:0;color:#526159;font-size:14px;line-height:1.6;">Do not share this code with anyone.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
