[project]
name = "brio"
version = "0.1.0"
description = "BRIO video editing workspace"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django>=5.2.6,<5.3",
    "boto3>=1.40,<2",
    "python-dotenv>=1.1,<2",
    "psycopg[binary]>=3.2,<4",
    "requests>=2.32,<3",
]

[tool.vercel]
entrypoint = "vedioos.wsgi:application"

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 110
exclude = [".venv", "node_modules", ".runtime", "static/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["I"]
