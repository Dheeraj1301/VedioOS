{% extends 'base.html' %}{% block content %}
<div class="verification-layout">
  <section class="verification-card session-conflict" aria-labelledby="session-heading">
    <h1 id="session-heading">This account is already signed in</h1>
    <form class="session-actions" method="post" action="{% url 'session_decision' %}">{% csrf_token %}
      <button class="button secondary" name="action" value="keep" type="submit">Keep other device</button>
      <button class="button" name="action" value="replace" type="submit">Sign out other device <span>↗</span></button>
    </form>
  </section>
</div>
{% endblock %}
